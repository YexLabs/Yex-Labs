<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="florusLogoTitle florusLogoDesc">
  <title id="florusLogoTitle">Florus</title>
  <desc id="florusLogoDesc">Plotted trajectory mark: a ruled arc crossing an orbital ring, terminating on a burnt-ochre node — a studio-drawn registration for Florus.</desc>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- baseline crosshair (cream) -->
    <path d="M12 64 H40 M88 64 H116 M64 12 V40 M64 88 V116" stroke="#F1E6CC" stroke-width="1.25" stroke-opacity="0.55" />
    <!-- orbital ring, open on one side -->
    <circle cx="64" cy="64" r="38" stroke="#F1E6CC" stroke-width="2" stroke-dasharray="4 5" stroke-opacity="0.85" />
    <!-- plotted trajectory arc (ochre) -->
    <path d="M20 96 Q44 72 64 64 T108 32" stroke="#B86B2A" stroke-width="3.25" />
    <!-- origin node (cream stroked) -->
    <circle cx="20" cy="96" r="4.5" fill="#0A0C0A" stroke="#F1E6CC" stroke-width="1.75" />
    <!-- vertex node (ochre solid) -->
    <circle cx="64" cy="64" r="5.5" fill="#B86B2A" />
    <!-- terminus node (ochre open) -->
    <circle cx="108" cy="32" r="4" fill="#0A0C0A" stroke="#B86B2A" stroke-width="2" />
    <!-- registration tick marks -->
    <path d="M62 22 H66 M22 62 H22 M62 106 H66 M106 62 H110" stroke="#B86B2A" stroke-width="1.5" />
  </g>
</svg>
